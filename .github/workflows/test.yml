name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  banner-generate-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install image tooling
        run: sudo apt-get update && sudo apt-get install -y imagemagick jq

      - name: Run generate.sh test suite
        run: bash src/banner_generate/test_generate.sh
