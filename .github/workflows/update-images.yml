name: Update Pokémon images

on:
  workflow_dispatch:
    inputs:
      correlation_id:
        required: true
        type: string

run-name: "Update images (${{ inputs.correlation_id }})"

jobs:
  update-images:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout pokenini-icon
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install image tooling
        run: sudo apt-get update && sudo apt-get install -y imagemagick webp jq

      - name: Cache pokemondb temp images
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: src/download-from-pokemon-db/images/temp
          key: pdb-images-temp-${{ github.run_id }}
          restore-keys: pdb-images-temp-

      - name: Download and copy "big" sprites from pokemondb.net
        run: |
          make pdb_dl
          make pdb_copy

      - name: Download and copy "small" sprites from koenigderluegner/pokemon-sprites
        run: |
          make koenig_update_sha
          make koenig_dl
          make koenig_select
          make koenig_copy

      - name: Fill in missing shiny placeholders
        run: make placeholders

      - name: Convert all .png sprites to .webp
        run: make img_convert

      - name: Check image dimensions
        run: make check_size | tee check_size_report.txt

      - name: Open a PR with any changed images
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
        with:
          commit-message: "chore(images): update Pokémon images"
          branch: update-images-${{ github.run_id }}
          title: "chore(images): update Pokémon images"
          body-path: check_size_report.txt
          add-paths: |
            images
            review
            src/koenig-sprites/SOURCE_SHA
          delete-branch: true
