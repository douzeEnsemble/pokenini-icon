name: Update Pokémon images

on:
  workflow_dispatch:
    inputs:
      correlation_id:
        required: true
        type: string

run-name: "Update images (${{ inputs.correlation_id }})"

jobs:
  update-images:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout pokenini-icon
        uses: actions/checkout@v5

      - name: Install image tooling
        run: sudo apt-get update && sudo apt-get install -y imagemagick webp jq

      - name: Download, convert and copy "big" sprites from pokemondb.net
        run: |
          make pdb_dl
          make pdb_convert
          make pdb_copy

      - name: Download and copy "small" sprites from koenigderluegner/pokemon-sprites
        run: |
          make koenig_update_sha
          make koenig_dl
          make koenig_select
          make koenig_copy

      - name: Regenerate "small" webp sprites from the new pngs
        run: |
          rm -f images/small/regular/*.webp images/small/shiny/*.webp
          make img_convert

      - name: Fill in missing shiny placeholders
        run: make placeholders

      - name: Check image dimensions
        run: make check_size | tee check_size_report.txt

      - name: Open a PR with any changed images
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Update Pokémon images"
          branch: update-images-${{ github.run_id }}
          title: "Update Pokémon images"
          body-path: check_size_report.txt
          add-paths: |
            images
            review
            src/koenig-sprites/SOURCE_SHA
          delete-branch: true
